<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>Pilot credential generator</title>
<style>
body{max-width:40rem;margin:auto;padding:1rem;font:17px/1.5 system-ui;color:#283c36}
label{display:block;margin-block:1rem}
input,textarea,button{font:inherit}
input,textarea{display:block;box-sizing:border-box;width:100%;padding:.5rem}
textarea{min-height:8rem}
button{min-height:44px;padding:.5rem 1rem}
</style>
</head>
<body>
<main>
<h1>Pilot credential generator</h1>
<p>Use this page on a trusted device. Generation happens locally in this tab. Copy the outputs to the private Apps Script settings and close this tab when finished.</p>
<label>Token key <input id="key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="64" placeholder="Paste the existing TOKEN_KEY to rotate an invitation"></label>
<button id="keygen" type="button">Generate a key for first setup</button>
<button id="reveal" type="button">Show or hide the token key</button>
<button id="invitegen" type="button">Generate a seven-day invitation</button>
<label>Private invitation for invited shoppers <input id="invite" readonly></label>
<label>INVITATION value for Apps Script <textarea id="value" readonly></textarea></label>
<p id="status" role="status"></p>
</main>
<script>
const words = `Acorn Amber Apple Arrow Aspen Atlas Aurora Badger Bay Bear Birch Blossom Blueberry Brook
  Cabin Canoe Cedar Cherry Clover Coast Comet Coral Cotton Creek Daisy Dawn Drift Duck Dust Eagle Elm
  Ember Falcon Fern Finch Fir Flint Forest Fox Garden Garnet Ginger Gold Goose Harbor Hazel Heron Hill
  Honey Iris Island Ivy Jade Jay Juniper Kettle Kite Lake Lark Laurel Lemon Lilac Lily Linden Lotus
  Luna Meadow Mint Moss Mountain Night Oak Ocean Olive Opal Orchard Otter Owl Palm Peach Pearl Pebble
  Petal Pine Plum Poppy Prairie Quartz Rain Raven Reed Ridge River Robin Rose Ruby Sage Sand Shell
  Sky Slate Snow Sparrow Spruce Star Stone Storm Summit Sun Swan Teal Thistle Tide Timber Trail Tulip
  Valley Violet Walnut Wave Willow Wind Wren Yarrow Zebra`.trim().split(/\s+/);
const key = document.getElementById('key');
const status = document.getElementById('status');
const hex = bytes => Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
const encoder = new TextEncoder();
function uniform(limit) {
  const random = new Uint32Array(1);
  const ceiling = Math.floor(2 ** 32 / limit) * limit;
  do crypto.getRandomValues(random); while (random[0] >= ceiling);
  return random[0] % limit;
}
document.getElementById('reveal').onclick = () => { key.type = key.type === 'password' ? 'text' : 'password'; };
document.getElementById('keygen').onclick = () => {
  if (key.value) {
    status.textContent = 'Clear the current field to generate a new key. Use the saved key when rotating invitations.';
    return;
  }
  try {
    key.value = hex(crypto.getRandomValues(new Uint8Array(32)));
    status.textContent = 'Copy this key to TOKEN_KEY in your script settings and keep it private.';
  } catch {
    status.textContent = 'Secure randomness is unavailable in this browser.';
  }
};
document.getElementById('invitegen').onclick = async () => {
  const inviteField = document.getElementById('invite');
  const valueField = document.getElementById('value');
  inviteField.value = valueField.value = '';
  if (!/^[a-f0-9]{64}$/.test(key.value)) {
    status.textContent = 'Enter the existing 64-character token key or generate one for first setup.';
    return;
  }
  try {
    const signingKey = await crypto.subtle.importKey('raw', encoder.encode(key.value),
      { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const invitation = words[uniform(words.length)] + String(uniform(10000)).padStart(4, '0');
    const digest = hex(new Uint8Array(await crypto.subtle.sign('HMAC', signingKey,
      encoder.encode('invite:' + invitation.toLowerCase()))));
    inviteField.value = invitation;
    valueField.value = JSON.stringify({ digest, expiresAt: new Date(Date.now() + 7 * 86400000).toISOString() });
    status.textContent = 'Copy the settings value into INVITATION and distribute the invitation directly.';
  } catch {
    status.textContent = 'Secure generation requires a trusted HTTPS page or localhost.';
  }
};
</script>
</body>
</html>
