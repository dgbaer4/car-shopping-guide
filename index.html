let pilotSession;
async function showRecommendations(limit){
  const panel=el('div');
  const nav=el('nav');
  const heading=el('h1','Vehicle recommendations');
  panel.append(heading,el('p','Loading vehicle data…'));
  nav.append(btn('Back to buyer profile',()=>go('review')));
  screen.replaceChildren(panel,nav);
  window.scrollTo(0,0);
  try{
    const {loadResults,renderResults}=await import('./engine/browser-results.mjs');
    const profile=buyerProfile();
    const profileKey=JSON.stringify(profile);
    if(pilotSession?.profileKey!==profileKey)pilotSession={profileKey,prices:new Map()};
    const view=await loadResults(profile,limit);
    if(!panel.isConnected)return;
    renderResults(panel,view,pilotSession);
    if(view.hasMore)nav.append(btn('Show more',()=>showRecommendations(view.nextLimit),'primary'));
  }catch(error){
    if(!panel.isConnected)return;
    panel.replaceChildren(heading,el('p','Vehicle data is unavailable. Open the guide over HTTP and try again.'));
    nav.append(btn('Retry',()=>showRecommendations(limit),'primary'));
