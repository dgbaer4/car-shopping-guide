name: Stage A catalog acquisition
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-acquisition-${{ github.ref }}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test NHTSA importer
        run: python -m unittest discover -s tests -p test_import_nhtsa.py
      - name: Restore NHTSA responses
        uses: actions/cache/restore@v5
        with:
          path: build/nhtsa-cache
          key: nhtsa-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nhtsa-v1-
      - name: Acquire EPA data
        run: |
          mkdir -p build
          curl --fail --location --retry 3 --max-time 180 https://www.fueleconomy.gov/feg/epadata/vehicles.csv -o build/vehicles.csv
          python tools/import_epa.py build/vehicles.csv build/epa.json
      - name: Acquire NHTSA safety variants
        run: |
          status=0
          python tools/import_nhtsa.py build/safety.json --report build/nhtsa-coverage.json --cache build/nhtsa-cache --seconds 2400 || status=$?
          case "$status" in
            0) echo "NHTSA acquisition finished for the requested scope." ;;
            2) echo "::warning::NHTSA acquisition is incomplete. See nhtsa-coverage.json." ;;
            *) exit "$status" ;;
          esac
      - name: Build explicitly incomplete development catalog
        run: |
          echo '{"records":[]}' > build/epa-only-safety.json
          echo '{}' > build/mappings.json
          python tools/build_catalog.py build/epa.json build/epa-only-safety.json build/mappings.json build/catalog-incomplete.json build/coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          status = "incomplete_development_only"
          catalog_file = Path("build/catalog-incomplete.json")
          catalog = json.loads(catalog_file.read_text())
          catalog["catalogStatus"] = status
          catalog_file.write_text(json.dumps(catalog, indent=2) + "\n")
          coverage_file = Path("build/coverage.json")
          coverage = json.loads(coverage_file.read_text())
          nhtsa = json.loads(Path("build/nhtsa-coverage.json").read_text())
          coverage.update(catalogStatus=status,
                          nhtsaAcquisitionComplete=nhtsa["complete"],
                          safetyMappingsApplied=0)
          coverage_file.write_text(json.dumps(coverage, indent=2) + "\n")
          PY
          echo 'Incomplete development catalog. Zero safety mappings applied.' >> "$GITHUB_STEP_SUMMARY"
          cat build/coverage.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve acquisition output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage-a-development-only
          path: |
            build/epa.json
            build/safety.json
            build/nhtsa-coverage.json
            build/catalog-incomplete.json
            build/coverage.json
          if-no-files-found: warn
      - name: Save completed NHTSA responses
        if: always() && hashFiles('build/nhtsa-cache/v1/*.json') != ''
        uses: actions/cache/save@v5
        with:
          path: build/nhtsa-cache
          key: nhtsa-v1-${{ github.run_id }}-${{ github.run_attempt }}
