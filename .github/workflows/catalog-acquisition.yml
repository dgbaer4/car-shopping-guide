name: Stage A catalog acquisition
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire EPA data
        run: |
          mkdir -p build
          curl --fail --location --retry 3 --max-time 180 https://www.fueleconomy.gov/feg/epadata/vehicles.csv -o build/vehicles.csv
          python tools/import_epa.py build/vehicles.csv build/epa.json
      - name: Acquire NHTSA safety variants
        run: python tools/import_nhtsa.py build/epa.json build/safety.json
      - name: Build catalog without unreviewed safety mappings
        run: |
          echo '{}' > build/mappings.json
          python tools/build_catalog.py build/epa.json build/safety.json build/catalog.json build/coverage.json
          cat build/coverage.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve acquisition output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-catalog
          path: |
            build/epa.json
            build/safety.json
            build/catalog.json
            build/coverage.json
          if-no-files-found: warn
