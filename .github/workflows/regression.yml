name: Development regression tests
on:
  push:
    branches: [feature/v0.3-recommendation-engine, feature/v0.3-integration, feature/v0.3-vehicle-pricing]
  pull_request:
    branches: [feature/v0.3-recommendation-engine, feature/v0.3-integration]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-equipment.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify integration catalog regeneration
        if: github.ref_name == 'feature/v0.3-integration' || github.ref_name == 'feature/v0.3-vehicle-pricing' || github.base_ref == 'feature/v0.3-integration'
        run: |
          python tools/build_integration_catalog.py "$RUNNER_TEMP/integration-catalog.json"
          cmp "$RUNNER_TEMP/integration-catalog.json" data/vehicle-catalog-v0.3-integration.json
          python tools/build_pilot_release.py
          python tools/build_vehicle_pricing.py
